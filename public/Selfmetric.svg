  <path d="M100,192 H208 V298 Q208,310 196,310 L156,310 L136,340 L136,310 Q100,310 100,298 Z" fill="#2E6FD8" style="fill:rgb(46, 111, 216);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bar chart inside -->
  <rect x="126" y="278" width="14" height="22" rx="3" fill="#6FA3E8" opacity="0.85" style="fill:rgb(111, 163, 232);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.85;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="146" y="264" width="14" height="36" rx="3" fill="#6FA3E8" opacity="0.85" style="fill:rgb(111, 163, 232);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.85;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="166" y="252" width="14" height="48" rx="3" fill="#6FA3E8" opacity="0.85" style="fill:rgb(111, 163, 232);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.85;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Bottom-right: Green with leaf -->
  <rect x="212" y="192" width="108" height="108" rx="28" ry="28" fill="#2E7D4F" style="fill:rgb(46, 125, 79);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Leaf icon -->
  <path d="M266,230 C266,230 240,238 240,262 C240,270 248,278 256,278 C272,278 292,262 292,238 C292,230 280,220 266,230 Z" fill="#52B370" style="fill:rgb(82, 179, 112);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Leaf vein -->
  <path d="M256,276 C260,260 270,244 285,232" stroke="#2E7D4F" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" style="fill:none;stroke:rgb(46, 125, 79);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>
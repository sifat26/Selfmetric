<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="400" height="400" style="">
  <defs>
    <clipPath id="outerClip">
      <rect x="100" y="80" width="220" height="220" rx="32" ry="32"/>
    </clipPath>
    <clipPath id="bottomLeftClip">

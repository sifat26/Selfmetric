    <!-- Left hand -->
    <path d="M-22,-8 C-22,-8 -30,0 -22,8 L-8,8 L0,0 L-8,-8 Z" fill="#F5D580" opacity="0.9" style="fill:rgb(245, 213, 128);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- Right hand -->
